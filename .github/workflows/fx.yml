name: fx-feed

# 每小时抓一次招行牌价（第 17 分钟）。
#
# 为什么不写 `0 * * * *`：GitHub 文档明确说整点是负载最高的时段，
# 定时任务会被延迟，极端情况直接丢弃排队的那一轮。错开 17 分钟避开整点。
#
# 为什么不是 5 分钟：公司记账只需要「这一天用的是银行真牌价」，不需要秒级。
# 每小时跑一次，一天有 24 次机会；某一轮被丢掉，下一轮自动补上，
# 不会出现「整天没价」。同时提交次数从 288 次/天降到 24 次/天，仓库不会虚胖。
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: # 手动跑一次，装完先验证

permissions:
  contents: write

# 上一轮没跑完就别再开一轮，避免两个 job 同时 push 打架
concurrency:
  group: fx-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓牌价
        run: node scripts/fetch.mjs

      - name: 有变化才提交
        run: |
          git config user.name  "fx-feed-bot"
          git config user.email "fx-feed-bot@users.noreply.github.com"
          git add fx.json
          # 🔴 先 add 再 diff --cached：文件还没被跟踪时 `git diff` 恒为空，
          # 第一轮会被误判成「没变化」而什么都不提交。
          if git diff --cached --quiet; then
            echo "牌价没变，跳过提交"
            exit 0
          fi
          git commit -m "fx $(date -u +%FT%TZ)"
          git push
